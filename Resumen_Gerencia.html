<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Dashboard - 3x2 Grid</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
	<style>
		html,body{height:100%;margin:0;font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif}
		/* Grid 3 columnas x 2 filas, ocupa pantalla completa */
		.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:12px;padding:12px;height:100vh;box-sizing:border-box;background:#f2f6fb}
		.tile{background:#ffffff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.12);overflow:hidden;display:flex;flex-direction:column}
		.tile-header{background:linear-gradient(90deg,#1e3c72,#2a5298);color:#fff;padding:10px 12px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
		.tile-body{padding:10px;flex:1;display:flex;gap:10px;align-items:stretch}
		/* Dentro del panel superior izquierdo dividimos en 2 columnas */
		.split{display:grid;grid-template-columns:35% 65%;gap:10px;width:100%}
		.chart-card{background:#fff;border-radius:6px;padding:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.03);display:flex;flex-direction:column}
		.chart-card .title{font-size:13px;font-weight:700;margin-bottom:6px;color:#333}
		canvas{width:100% !important;height:100% !important}
		/* small responsive tweaks */
		@media(max-width:900px){.grid{grid-template-columns:1fr;grid-template-rows:repeat(6,1fr)}}
	</style>
</head>
<body>
		<style>
			/* Auditoria donuts styles (scaled to 80% to free space for mini donuts) */

			.floating-home:active{transform:translateY(1px)}

		.donut-header .smallnum{font-weight:700;color:#155724;margin-left:1px}
	</style>

	<script>
		// Registrar plugin
		Chart.register(ChartDataLabels);

		// Configuración de origen de datos:
		// - Depurado Corte: usa `SHEET_ID` (spreadsheet principal, p.ej. para 'base' y 'prod_corte').
		// - Pdas 2das y 3ras: usa `SEG_SHEET_ID` (spreadsheet distinto, igual al usado en `SEGUNDAS Y TERCERAS.html`).
		const SHEET_ID = '1sFkWMxxLM7DO4erVoQtvHyrUk8ynJ4E1PVf6dIwnuBg';
		const BASE_SHEET = 'base';
		const PROD_CORTE_SHEET = 'prod_corte';
		// Auditoria Lotes de Produccion sheet (usa otro spreadsheet)
		const AUD_SHEET_ID = '1Xu3bN-RVzPYuIqcVyb0ZxvlFTUjl2_MWHnDJik6lZ4s';
		// Datos cargados desde la hoja de auditoria
		let audData = [];

		// Datos cargados desde la hoja
		let baseData = [];
		let prodCorteData = [];
		let defectColumns = [];

		// Placeholders iniciales (vacíos hasta cargar datos reales)
		const paretoLabels = [];
		const paretoValues = [];

		const paretoCtx = document.getElementById('paretoChart').getContext('2d');
		const paretoChart = new Chart(paretoCtx, {
			type: 'bar',
			data: {
				labels: paretoLabels,
				datasets: [{
					label: 'Piezas Defectuosas',
					data: paretoValues,
					backgroundColor: '#1e5288'
				}]
			},
			options: {
				indexAxis: 'y',
				maintainAspectRatio: false,
				plugins: {
					legend: {display:false},
					datalabels: {
						color: 'white',
						anchor: 'end',
						align: 'right',
						font: { size: 10 },
						formatter: v => v
					}
					,tooltip: {
						callbacks: {
							title: function(items){
								if (!items || items.length === 0) return '';
								return items[0].label || '';
							},
							label: function(ctx){
								const v = (ctx && (ctx.formattedValue !== undefined)) ? ctx.formattedValue : (ctx.parsed && ctx.parsed.x !== undefined ? ctx.parsed.x : '');
								return ':' + v;
							}
						}
					}
				},
				scales: {
					x: {grid:{display:true},beginAtZero:true},
					y: {ticks:{font:{size:9},color:'#111'}, afterTickToLabelConversion: function(){}}
				}
			}
		});

		// --- Helpers para cargar Google Sheets via GViz JSONP ---
		function gvizToObjects(resp) {
			if (!resp || !resp.table) return [];
			const cols = (resp.table.cols || []).map(c => String(c.label || c.id || '').trim());
			return (resp.table.rows || []).map(r => {
				const o = {};
				cols.forEach((h, i) => {
					const cell = r.c && r.c[i] ? r.c[i] : null;
					o[h] = cell && (cell.v !== null && cell.v !== undefined) ? cell.v : '';
				});
				return o;
			});
		}

		function loadSheetJSONP(sheetId, sheetName) {
			return new Promise((resolve, reject) => {
				const cbName = 'GVIZ_CB_' + Math.random().toString(36).slice(2);
				let script = document.createElement('script');
				const timer = setTimeout(() => { cleanup(); reject(new Error(`Timeout al cargar "${sheetName}"`)); }, 15000);

				function cleanup() { clearTimeout(timer); delete window[cbName]; if (script && script.parentNode) script.parentNode.removeChild(script); }

				window[cbName] = function(resp) { cleanup(); try { resolve(gvizToObjects(resp)); } catch (e) { reject(new Error('Error al procesar datos: ' + e.message)); } };

				script.onerror = () => { cleanup(); reject(new Error(`No se pudo cargar "${sheetName}"`)); };
				const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq`;
				const url = `${base}?sheet=${encodeURIComponent(sheetName)}&headers=1&tq=${encodeURIComponent('select *')}&tqx=out:json;responseHandler:${cbName}&nocache=${Date.now()}`;
				script.src = url;
				document.head.appendChild(script);
			});
		}

		function toNum(val) { if (val === '' || val === null || val === undefined) return 0; const n = parseFloat(val); return isNaN(n) ? 0 : n; }

		function getWeekNumber(date) {
			const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
			const dayNum = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - dayNum);
			const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
			return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
		}

		function parseDateFlexible(input) {
			if (!input && input !== 0) return null;
			if (input instanceof Date) return isNaN(input) ? null : input;
			if (typeof input === 'object' && input.v instanceof Date) return isNaN(input.v) ? null : input.v;
			if (typeof input === 'object' && input.f) { const parsed = parseDateFlexible(String(input.f).trim()); if (parsed) return parsed; }
			if (typeof input === 'number') {
				if (input > 0 && input < 100000) { const excelEpoch = new Date(1899,11,30); const d = new Date(excelEpoch.getTime() + input * 86400000); if (!isNaN(d)) return d; }
				const d2 = new Date(input); if (!isNaN(d2)) return d2;
			}
			const s = String(input).trim(); if (!s) return null;
			const dateMatch = s.match(/^Date\((\d+),(\d+),(\d+)\)$/);
			if (dateMatch) { const year = parseInt(dateMatch[1],10); const month = parseInt(dateMatch[2],10); const day = parseInt(dateMatch[3],10); const d = new Date(year, month, day); if (!isNaN(d)) return d; }
			let d = new Date(s); if (!isNaN(d) && d.getFullYear() > 1900) return d;
			const m1 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
			if (m1) {
				const p1 = parseInt(m1[1],10), p2 = parseInt(m1[2],10), year = parseInt(m1[3],10);
				function tryDMY() { return new Date(year, p2 - 1, p1); }
				function tryMDY() { return new Date(year, p1 - 1, p2); }
				let res = tryMDY(); if (!isNaN(res)) return res; res = tryDMY(); if (!isNaN(res)) return res;
			}
			const m2 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
			if (m2) { const year = parseInt(m2[1],10); const month = parseInt(m2[2],10) - 1; const day = parseInt(m2[3],10); d = new Date(year, month, day); if (!isNaN(d)) return d; }
			return null;
		}

		// Helper global: extraer número de semana desde una fila (soporta 'SEM50', numbers, _week)
		function getWeekFromRow(r){
			if (!r) return 0;
			if (r._week) return toNum(r._week);
			if (r.SEM && typeof r.SEM === 'number') return toNum(r.SEM);
			const s = (r.SEM||r.sem||r['SEM']||'').toString().toUpperCase().trim();
			const m = s.match(/(\d{1,3})$/);
			if (m) return toNum(m[1]);
			const m2 = s.match(/SEM\s*(\d{1,3})/i);
			if (m2) return toNum(m2[1]);
			// Fallback: try parsing a date field (including FECHA DE TIMBRADO) and derive ISO week
			const dateCandidates = [ 'FECHA DE TIMBRADO', 'FECHA_DE_TIMBRADO', 'FECHA', 'Fecha', 'FECHA_CORTE', 'FECHA CORTE' ];
			for (const key of dateCandidates){
				const v = r[key];
				const d = parseDateFlexible(v);
				if (d) return getWeekNumber(d);
			}
			return 0;
		}

		// Helper global: sumar campos cuyo nombre contenga ciertas keywords
		function sumByKeyKeywords(row, keywords){
			let s = 0;
			if (!row) return 0;
			Object.keys(row).forEach(k=>{
				const uk = k.toUpperCase();
				if (keywords.some(kw=>uk.includes(kw))) s += toNum(row[k]);
			});
			return s;
		}

		// Helper: convertir texto a Mayscula inicial + minusculas (Title Case)
		function toTitleCase(s){
			if (!s && s !== 0) return '';
			const str = String(s).trim().toLowerCase();
			return str.split(/\s+/).map(w=> w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
		}

		// Normalizar etiquetas específicas de defectos (mapeo de excepciones)
		function normalizeDefectLabel(raw){
			if (!raw && raw !== 0) return '';
			const key = String(raw).trim().toUpperCase();
			const map = {
				'HUECO POR PRUEBA': 'Hueco Prueba',
				'HUECO POR PROCESO': 'Hueco Proceso',
				'MANCHAS DE TINTORERIA': 'Mnch Tinto',
				'MANCHAS DE TINTORERÍA': 'Mnch Tinto'
			};
			if (map[key]) return map[key];
			return toTitleCase(raw);
		}

		function detectDefectColumns(data) {
			if (!data || data.length === 0) return [];
			const allCols = Object.keys(data[0]);
			const knownCols = ['SEM','SEMANA','CLIENTE','OP','TENDIDO','FECHA','FECHA CORTE','FECHA_COR','CODIGO','TELA','PARTIDA','DESCRIPCION','COLOR','OP_TELA','PTDA','CANT.','CANT','CORTADA','DEPURADO','RECUPERADOS','RECUPERADO','REAL','NO RECUPERADO','PERDIDA','NETA','FACTORY','_YEAR','_MONTH','_WEEK'];
			const knownUpper = knownCols.map(k => k.toUpperCase());
			return allCols.filter(col => {
				if (!col || String(col).trim() === '') return false;
				const trimmed = String(col).trim();
				// Excluir campos internos que comienzan con underscore
				if (trimmed.charAt(0) === '_') return false;
				const upper = trimmed.toUpperCase();
				// Excluir si el nombre contiene alguna palabra conocida (case-insensitive)
				return !knownUpper.some(k => upper.includes(k));
			});
		}

		function calculatePareto(data) {
			const defectTotals = {};
			defectColumns.forEach(col => defectTotals[col] = 0);
			data.forEach(row => { defectColumns.forEach(col => { defectTotals[col] += toNum(row[col]); }); });
			const sorted = Object.entries(defectTotals).filter(([_,v])=>v>0).sort((a,b)=>b[1]-a[1]);
			const total = sorted.reduce((s,[_,v])=>s+v,0);
			let cumulative = 0;
			return sorted.map(([defect,value]) => { cumulative += value; return { defect: defect.length>25? defect.substring(0,22)+'...' : defect, fullDefect: defect, value, percent: total>0? (value/total)*100:0, cumulative: total>0? (cumulative/total)*100:0 }; });
		}

		function calculateWeekComparison(baseAll, prodCorteAll) {
			const base = baseAll && baseAll.length ? baseAll : baseData;
			const prod = prodCorteAll && prodCorteAll.length ? prodCorteAll : prodCorteData;
			const today = new Date(); const lastWeekDate = new Date(today); lastWeekDate.setDate(today.getDate()-7);
			const weeks = [];
			for (let i=9;i>=0;i--) { const d = new Date(lastWeekDate); d.setDate(lastWeekDate.getDate() - (i*7)); weeks.push(getWeekNumber(d)); }
			const labels = weeks.map(w=>`SEM${w}`);
			const cortadas=[]; const revisadas=[]; const realNoRecuperado=[]; const pctRealNoRecuperado=[];

			weeks.forEach(week=>{
				const prodRows = prod.filter(r=> getWeekFromRow(r) === week || toNum(r._week) === week || toNum(r.SEM) === week);
				const cort = prodRows.reduce((s,r)=> s + (toNum(r['CANTIDAD CORTADA'])||toNum(r.CANTIDAD_CORTADA)||toNum(r['CANT. CORTADA'])||0),0) || prodRows.reduce((s,r)=> s + sumByKeyKeywords(r,['CORT','CORTAD','CORTADA']),0);
				const rev = prodRows.reduce((s,r)=> s + (toNum(r['CANTIDAD REVISADA'])||toNum(r.CANTIDAD_REVISADA)||0),0) || prodRows.reduce((s,r)=> s + sumByKeyKeywords(r,['REV','REVIS']),0);
				const baseRows = base.filter(r=> toNum(r._week)==week || getWeekFromRow(r) === week || toNum(r.SEM)==week);
				const real = baseRows.reduce((s,r)=> s + (toNum(r['REAL NO RECUPERADO'])||toNum(r['REAL_RECUPERADO'])||toNum(r.REAL)||toNum(r['NO RECUPERADO'])||0),0) || baseRows.reduce((s,r)=> s + sumByKeyKeywords(r,['REAL','RECUPERAD','NO RECUPERAD']),0);
				cortadas.push(cort); revisadas.push(rev); realNoRecuperado.push(real);
				const pct = rev>0? (real/rev)*100 : 0; pctRealNoRecuperado.push(pct);
			});
			return { labels, cortadas, revisadas, realNoRecuperado, pctRealNoRecuperado };
		}

		function calculateMonthComparison(baseAll, prodCorteAll) {
			const base = baseAll && baseAll.length ? baseAll : baseData;
			const prod = prodCorteAll && prodCorteAll.length ? prodCorteAll : prodCorteData;
			const today = new Date(); const months=[]; const monthNames=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
			for (let i=9;i>=0;i--) { const d = new Date(today.getFullYear(), today.getMonth() - i, 1); months.push({ year: d.getFullYear(), month: d.getMonth()+1, label: monthNames[d.getMonth()] }); }
			const labels = months.map(m=>m.label);
			const cortadas=[]; const revisadas=[]; const realNoRecuperado=[]; const pctRealNoRecuperado=[];

		// --- Auditoria donuts renderer (adapted from AUDITORIA LOTES DE PRODUCCION) ---
		function makeDonutSVG(percentage, size=160, strokeWidth=18, color='#1e88e5', bgColor='#e6eef8'){
			const radius = (size - strokeWidth) / 2;
			const cx = size/2, cy = size/2;
			const circ = 2 * Math.PI * radius;
			const pct = Math.max(0, Math.min(100, Number(percentage) || 0));
			const dash = (pct/100) * circ;
			const svg = `<?xml version="1.0"?>\n<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">\n  <circle cx="${cx}" cy="${cy}" r="${radius}" stroke="${bgColor}" stroke-width="${strokeWidth}" fill="none" />\n  <circle cx="${cx}" cy="${cy}" r="${radius}" stroke="${color}" stroke-width="${strokeWidth}" fill="none" stroke-dasharray="${dash} ${circ - dash}" stroke-linecap="round" transform="rotate(0 ${cx} ${cy})"/>\n</svg>`;
			return svg;
		}

		// Devuelve las filas relevantes para Auditoria según periodo (SEM/MES)
		// Para MES: prioriza el mes actual; si no hay datos del mes actual, toma el último mes disponible
		function getAuditRowsForPeriod(period){
			// Return rows for the requested period (week or month).
			// NOTE: do not pre-filter by text 'COSTURA' here — caller will pick COSTURA rows by equipo number.
			const rowsAll = Array.isArray(audData) ? audData.slice() : [];
			if (!rowsAll.length) return rowsAll;
			const per = (period || (document.getElementById('audPeriodSelect') && document.getElementById('audPeriodSelect').value) || 'SEM').toString().toUpperCase();
			if (per === 'SEM'){
				const lastWeek = rowsAll.reduce((mx, r) => Math.max(mx, getWeekFromRow(r) || toNum(r._week) || 0), 0);
				return rowsAll.filter(r=> getWeekFromRow(r) === lastWeek || toNum(r._week) === lastWeek || toNum(r.SEM) === lastWeek);
			} else {
				// prefer current calendar month
				const now = new Date();
				const curY = now.getFullYear();
				const curM = now.getMonth() + 1;
				const byMonth = rowsAll.filter(r => (toNum(r._year) === curY && (toNum(r._month) === curM || toNum(r.MES) === curM)));
				if (byMonth && byMonth.length) return byMonth;

				// fallback: use last available year-month in the data
				const keys = new Set();
				rowsAll.forEach(r=>{ const y=toNum(r._year)||0; const m=toNum(r._month)||toNum(r.MES)||0; if(y&&m) keys.add(`${y}-${String(m).padStart(2,'0')}`); });
				const arr = Array.from(keys).sort();
				if (!arr.length) return rowsAll;
				const last = arr[arr.length-1]; const [yy,mm] = last.split('-').map(s=>parseInt(s,10));
				return rowsAll.filter(r=> toNum(r._year) === yy && (toNum(r._month) === mm || toNum(r.MES) === mm));
			}
		}

		// Detect equipo number from a row using common header names or inline patterns
		function getEquipoNumberFromRow(r){
			if(!r) return null;
			// try explicit headers that usually contain equipo
			const keys = Object.keys(r || {});
			const candidate = keys.find(k => {
				const u = k.toString().toUpperCase();
				return u.includes('EQUIP') || u === 'EQ' || u.includes('EQP') || u.includes('EQUIPOS') || u.includes('MAQ') || u.includes('LINE');
			});
			if(candidate){
				const v = r[candidate];
				const n = parseInt(String(v||'').replace(/[^0-9\-]/g,''),10);
				if(!isNaN(n)) return n;
			}
			// try scanning values for patterns like 'Eq 12' or 'EQUIPOS 1-29' or numbers inside parenthesis
			for(const k of keys){
				const v = (r[k]||'').toString().toUpperCase();
				let m = v.match(/EQ(?:UIP)?\s*[:#\-]?\s*(\d{1,2})/i);
				if(m && m[1]) return parseInt(m[1],10);
				m = v.match(/EQUIPOS?\s*(\d{1,2})\s*[-–]\s*(\d{1,2})/i);
				if(m && m[1]) return parseInt(m[1],10);
				m = v.match(/\b(\d{1,2})\b/);
				if(m && m[1]){
					// only accept small numbers that look like equipo
					const nn = parseInt(m[1],10);
					if(nn >=1 && nn <= 99) return nn;
				}
			}
			return null;
		}

		// Compute aggregated sums and per-equipo breakdown for auditoria rows
		function computeAuditoriaSums(period){
			const rowsAll = Array.isArray(audData) ? audData.slice() : [];
			const per = (period || (document.getElementById('audPeriodSelect') && document.getElementById('audPeriodSelect').value) || 'SEM').toString().toUpperCase();

			function normKey(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
			function getISOWeekYear(d){ if(!(d instanceof Date)) return null; const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dayNum = date.getUTCDay() || 7; date.setUTCDate(date.getUTCDate() + 4 - dayNum); const isoYear = date.getUTCFullYear(); const yearStart = new Date(Date.UTC(isoYear,0,1)); const week = Math.ceil((((date - yearStart) / 86400000) + 1)/7); return { year: isoYear, week: week }; }

			// find best header for 'Cant Muestra' in audData
			const cantHeaderCandidates = ['cant muestra','cant.muestra','cant_muestra','cantidad','cant.','cant'];
			let cantHeader = null;
			if(rowsAll.length){
				const keys = Object.keys(rowsAll[0]);
				for(const k of keys){ const nk = normKey(k); if(nk === 'cant muestra'){ cantHeader = k; break; } }
				if(!cantHeader){ for(const k of keys){ const nk = normKey(k); if(cantHeaderCandidates.some(c=> nk.includes(c))) { cantHeader = k; break; } } }
			}

			// detect exact header for total (T.Aud / Total) to match AUDITORIA logic
			const totalHeaderCandidates = ['total aud','total_aud','total','total_auditor','total_auditoria'];
			let totalHeader = null;
			if(rowsAll.length){
				const keys2 = Object.keys(rowsAll[0]);
				for(const k of keys2){ const nk = normKey(k); if(nk === 'total' || nk === 'total aud'){ totalHeader = k; break; } }
				if(!totalHeader){ for(const k of keys2){ const nk = normKey(k); if(totalHeaderCandidates.some(c=> nk.includes(c))) { totalHeader = k; break; } } }
			}

			// Build list of rows to consider: for SEM select rows matching the latest ISO week based on parsed dates; for MES reuse getAuditRowsForPeriod
			let rows = [];
			if(per === 'SEM'){
				// collect parsed dates from rowsAll
				const dated = rowsAll.map(r => { const d = (r._parsedFecha instanceof Date) ? r._parsedFecha : (parseDateFlexible(r['FECHA DE TIMBRADO']||r['FECHA_DE_TIMBRADO']||r['FECHA']||r['Fecha Auditoria']||r['FECHA_AUDITORIA']||r['Fecha_Auditoria']||r['FECHA CORTE']||r['FECHA_CORTE']||r._fecha||r.fecha||'')); return { r, d }; }).filter(x=> x.d instanceof Date && !isNaN(x.d));
				if(dated.length === 0){ rows = getAuditRowsForPeriod(per) || rowsAll; }
				else{
					// find latest ISO year-week
					let latest = { year:0, week:0 };
					dated.forEach(x=>{ const iw = getISOWeekYear(x.d); if(!iw) return; if(iw.year > latest.year || (iw.year === latest.year && iw.week > latest.week)) latest = iw; });
					// filter rowsAll to those with same iso year/week
					rows = rowsAll.filter(r => {
						const d = (r._parsedFecha instanceof Date) ? r._parsedFecha : parseDateFlexible(r['FECHA DE TIMBRADO']||r['FECHA_DE_TIMBRADO']||r['FECHA']||r['Fecha Auditoria']||r['FECHA_AUDITORIA']||r['Fecha_Auditoria']||r['FECHA CORTE']||r['FECHA_CORTE']||r._fecha||r.fecha||'');
						if(!d) return false; const iw = getISOWeekYear(d); if(!iw) return false; return iw.year === latest.year && iw.week === latest.week;
					});
				}
			} else {
				rows = getAuditRowsForPeriod(per) || rowsAll;
			}
			const sampleKeys = ['CANT MUESTRA','CANT.MUESTRA','CANTIDAD','CANT.','CANT','CANT_MUESTRA'];
			const defKeys = ['TOTAL DEFECTOS','TOTAL_DEFECTOS','DEFECTOS','TOTAL_DEF'];
			const a1Keys = ['A 1','A1','A_1','A.1'];
			const totalAudKeys = ['TOTAL AUD','TOTAL_AUD','TOTAL'];
			const dayKeys = ['DIA','DIAS','DAY'];
			const nightKeys = ['NOCHE','NOC','NIGHT'];

			const sums = {
				costura: { cant:0, def:0, a1:0, total:0 },
				costura_1_19: { cant:0, def:0, a1:0, total:0 },
				costura_20_29: { cant:0, def:0, a1:0, total:0 },
				acabados: { cant:0, def:0, a1:0, total:0 },
				shifts: { day:0, night:0 }
			};
			const perEquipo = {};

			rows.forEach(r=>{
				if(!r) return;
				const eq = getEquipoNumberFromRow(r);
				const containsCostura = Object.values(r).some(v=> (v||'').toString().toUpperCase().includes('COSTURA'));
				const rowSample = (typeof cantHeader === 'string' && cantHeader in r) ? toNum(r[cantHeader]) : (sumByKeyKeywords(r, sampleKeys) || 0);
				const rowDef = sumByKeyKeywords(r, defKeys) || 0;
				const rowA1 = sumByKeyKeywords(r, a1Keys) || 0;
				const rowTotal = (typeof totalHeader === 'string' && totalHeader in r) ? toNum(r[totalHeader]) : (sumByKeyKeywords(r, totalAudKeys) || 0);
				const rowDay = sumByKeyKeywords(r, dayKeys) || 0;
				const rowNight = sumByKeyKeywords(r, nightKeys) || 0;

				// accumulate shifts
				sums.shifts.day += rowDay;
				sums.shifts.night += rowNight;

				// per-equipo
				let eqKey = (eq !== null && !isNaN(eq)) ? String(eq) : (containsCostura ? 'COSTURA_UNKNOWN' : 'UNKNOWN');
				if(!perEquipo[eqKey]) perEquipo[eqKey] = { cant:0, def:0, a1:0, total:0 };
				perEquipo[eqKey].cant += rowSample;
				perEquipo[eqKey].def += rowDef;
				perEquipo[eqKey].a1  += rowA1;
				perEquipo[eqKey].total += rowTotal;

				// classify into groups
				if (eq !== null && !isNaN(eq)){
					if (eq >=1 && eq <=19){
						sums.costura.cant += rowSample; sums.costura.def += rowDef; sums.costura.a1 += rowA1; sums.costura.total += rowTotal;
						sums.costura_1_19.cant += rowSample; sums.costura_1_19.def += rowDef; sums.costura_1_19.a1 += rowA1; sums.costura_1_19.total += rowTotal;
					} else if (eq >=20 && eq <=29){
						sums.costura.cant += rowSample; sums.costura.def += rowDef; sums.costura.a1 += rowA1; sums.costura.total += rowTotal;
						sums.costura_20_29.cant += rowSample; sums.costura_20_29.def += rowDef; sums.costura_20_29.a1 += rowA1; sums.costura_20_29.total += rowTotal;
					} else {
						// equipos fuera de rango considerarlos acabados
						sums.acabados.cant += rowSample; sums.acabados.def += rowDef; sums.acabados.a1 += rowA1; sums.acabados.total += rowTotal;
					}
				} else if (containsCostura) {
					// unknown equipo but text mentions COSTURA => treat as costura
					sums.costura.cant += rowSample; sums.costura.def += rowDef; sums.costura.a1 += rowA1; sums.costura.total += rowTotal;
				} else {
					// otherwise accumulate to total as unknown/other (we won't display)
				}
			});

			return { sums, perEquipo };
		}

		function renderAuditoriaTile(period){
			const per = (period || (document.getElementById('audPeriodSelect') && document.getElementById('audPeriodSelect').value) || 'SEM').toString().toUpperCase();
			// Try to compute values from baseData filtered by period; fallback to example numbers
			let cant = 3866, tdef = 294, total = 331, a1 = 200;
			// make sums/perEquipo available beyond the try block so mini-donuts can reuse them
			let sums = null;
			let perEquipo = {};
			try{
				const res = computeAuditoriaSums(per) || {};

		function detectTipoKey(rows){ if(!rows||!rows.length) return null; return Object.keys(rows[0]).find(k=> ['TIPO','TIPO.','TYPE','TIP'].includes(k.toString().toUpperCase()) || k.toString().toUpperCase().includes('TIPO')) || null; }

		function detectIngresoQtyCol(rows){ if(!rows||!rows.length) return INGRESO_QTY_FALLBACK_COL; const keys = Object.keys(rows[0] || {}); let best=null; let bestSum=0; keys.forEach(k=>{ let s=0; rows.forEach(r=> s += Math.abs(toNum(r[k])) ); if(s>bestSum){ bestSum = s; best = k; } }); const prefer = keys.find(k=> k.toUpperCase().includes('TOTAL') || k.toUpperCase().includes('INGRES') || k.toUpperCase().includes('CANT')); return prefer || best || INGRESO_QTY_FALLBACK_COL; }

	// Extrae año desde una fila (intenta FECHA DE TIMBRADO u otros fallback _year/AÑO)
	function getYearFromRow(r){
		if(!r) return 0;
		const possible = r['FECHA DE TIMBRADO']||r['FECHA_DE_TIMBRADO']||r['FECHA']||r['Fecha']||r.FECHA||r['FECHA_CORTE']||r['FECHA CORTE']||'';
		const d = parseDateFlexible(possible);
		if(d) return d.getFullYear();
		return toNum(r._year) || toNum(r.AÑO) || toNum(r['AÑO']) || 0;
	}

		// Obtener el último par { year, month } disponible en los datos base.
		// Usa _year/_month si existen; si no, intenta parsear campos de fecha y toma la moda.
		function getLastYearMonth(rows) {
			if (!rows || !rows.length) return null;
			const counts = {};
			rows.forEach(r => {
				let y = toNum(r._year) || toNum(r.AÑO) || toNum(r['AÑO']) || 0;
				let m = toNum(r._month) || toNum(r.MES) || toNum(r['MES']) || 0;
				if (!y || !m) {
					// intentar parsear campos comunes
					const possible = r['FECHA CORTE'] || r['FECHA_CORTE'] || r['FECHA DE TIMBRADO'] || r['FECHA_DE_TIMBRADO'] || r['FECHA'] || r.FECHA || '';
					const d = parseDateFlexible(possible);
					if (d) { y = d.getFullYear(); m = d.getMonth() + 1; }
				}
				if (y && m) {
					const k = `${y}-${String(m).padStart(2,'0')}`;
					counts[k] = (counts[k] || 0) + 1;
				}
			});
			const keys = Object.keys(counts);
			if (!keys.length) return null;
			// elegir el key con mayor frecuencia (moda)
			keys.sort((a,b) => counts[b] - counts[a]);
			const top = keys[0];
			const parts = top.split('-');
			return { year: parseInt(parts[0],10), month: parseInt(parts[1],10) };
		}

	// Devuelve el par { year, week } correspondiente a la última semana disponible en rows
	function getLatestYearWeek(rows){
		if(!rows || !rows.length) return null;
		let maxYear = 0, maxWeek = 0;
		rows.forEach(r=>{
			const y = getYearFromRow(r) || 0;
			const w = getWeekFromRow(r) || toNum(r._week) || 0;
			if(!y && !w) return;
			if(y > maxYear || (y === maxYear && w > maxWeek)){
				maxYear = y; maxWeek = w;
			}
		});
		if(maxYear === 0 && maxWeek === 0) return null;
		return { year: maxYear, week: maxWeek };
	}

		function buildSegPareto(tipoFilter, periodo){
			const rowsAll = (segDefectRows||[]).slice();
			const periodoSel = (periodo || (document.getElementById('segPeriodSelect')||{}).value || 'SEM').toString().toUpperCase();
			let rows = rowsAll;
			if(periodoSel === 'SEM'){
				// select rows for latest ISO week available using YEAR+WEEK (avoid mixing years)
				const latest = getLatestYearWeek(rowsAll);
				if(latest && latest.year && latest.week){
					rows = rowsAll.filter(r => {
						const y = getYearFromRow(r) || toNum(r._year) || toNum(r.AÑO) || 0;
						const w = getWeekFromRow(r) || toNum(r._week) || 0;
						return y === latest.year && w === latest.week;
					});
				}
			} else {
				// MES: select rows for latest year-month available
				const ymSet = new Set();
				rowsAll.forEach(r=>{
					const y = toNum(r._year) || toNum(r.AÑO) || toNum(r['AÑO']) || 0;
					const m = toNum(r._month) || toNum(r.MES) || toNum(r['MES']) || 0;
					if(y && m) ymSet.add(`${y}-${String(m).padStart(2,'0')}`);
					else {
						const d = parseDateFlexible(r['FECHA DE TIMBRADO']||r['FECHA_DE_TIMBRADO']||r['FECHA']||r['Fecha']||r.FECHA||r['FECHA_CORTE']||r['FECHA CORTE']||'');
						if(d) ymSet.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
					}
				});
				if(ymSet.size){
					const arrYm = Array.from(ymSet).sort();
					const last = arrYm[arrYm.length-1];
					rows = rowsAll.filter(r=>{
						const y = toNum(r._year) || toNum(r.AÑO) || toNum(r['AÑO']) || 0;
						const m = toNum(r._month) || toNum(r.MES) || toNum(r['MES']) || 0;
						if(y && m) return `${y}-${String(m).padStart(2,'0')}` === last;
						const d = parseDateFlexible(r['FECHA DE TIMBRADO']||r['FECHA_DE_TIMBRADO']||r['FECHA']||r['Fecha']||r.FECHA||r['FECHA_CORTE']||r['FECHA CORTE']||'');
						if(d) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === last;
						return false;
					});
				}
			}
			if(!rows.length){ updatePareto([],[]); return; }
			const tipoKey = detectTipoKey(rows);
			let availableCols = Object.keys(rows[0] || {});
			let defectCols = SEG_DEFECT_DEFS.map(d => d.col).filter(c => availableCols.includes(c));
			if (!defectCols.length) defectCols = detectDefectColumns(rows);
			const agg = {};
			rows.forEach(r=>{
				if(!r) return;
				const tval = tipoKey ? String(r[tipoKey]||'').toUpperCase() : '';
				if(tipoFilter && tipoFilter !== 'TODO' && tval !== tipoFilter) return;
				defectCols.forEach(c=>{ const v = toNum(r[c]); if(v===0) return; agg[c] = (agg[c]||0) + v; });
			});
			const arr = Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,7);
			const labels = arr.map(a=> normalizeDefectLabel(a[0]));
			const values = arr.map(a=>a[1]);
			updatePareto(labels, values);
		}

		function updatePareto(labels, values){

					}
				});

		function buildSegPctChart(tipoFilter, periodo){
			const rows = (segDefectRows||[]).slice();
			const ingreso = (segIngresoRows||[]).slice();
			if(!rows.length || !ingreso.length){ updatePctChart([],[],[]); return; }
			const tipoKey = detectTipoKey(rows);
			// Prefer canonical defect columns when possible
			let availableCols2 = Object.keys(rows[0] || {});
			let defectCols = SEG_DEFECT_DEFS.map(d => d.col).filter(c => availableCols2.includes(c));
			if (!defectCols.length) defectCols = detectDefectColumns(rows);
			const per = periodo === 'MES' ? 'MES' : 'SEM';
			const defByPeriod = {};
			const ingByPeriod = {};
			rows.forEach(r=>{
				if(!r) return;
				const tval = tipoKey ? String(r[tipoKey]||'').toUpperCase() : '';
				if(tipoFilter && tipoFilter !== 'TODO' && tval !== tipoFilter) return;
				const key = (function(){
					if(per==='SEM'){
						const wk = getWeekFromRow(r) || toNum(r._week) || 0;
						const yy = getYearFromRow(r) || toNum(r._year) || toNum(r.AÑO) || 0;
						return yy && wk ? ('SEM' + yy + '-'+ String(wk).padStart(2,'0')) : ('SEM' + String(wk));
					}
					const d = parseDateFlexible(r['FECHA DE TIMBRADO']||r['FECHA_DE_TIMBRADO']||r['FECHA']||r['Fecha']||r.FECHA||r['FECHA_CORTE']||r['FECHA CORTE']||'');
					if(d) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
					return (r._year||r.AÑO||r['AÑO']||'') + '-' + String(r._month||r.MES||'').padStart(2,'0');
				})();
				if(!key) return;
				let s = 0; defectCols.forEach(c=> s += toNum(r[c]));
				defByPeriod[key] = (defByPeriod[key]||0) + s;
			});
			const qtyCol = detectIngresoQtyCol(ingreso);
			ingreso.forEach(r=>{
				if(!r) return;
				const key = (function(){
					if(per==='SEM'){
						const wk = getWeekFromRow(r) || toNum(r._week) || 0;
						const yy = getYearFromRow(r) || toNum(r._year) || toNum(r.AÑO) || 0;
						return yy && wk ? ('SEM' + yy + '-'+ String(wk).padStart(2,'0')) : ('SEM' + String(wk));
					}
					const d = parseDateFlexible(r['FECHA DE TIMBRADO']||r['FECHA_DE_TIMBRADO']||r['FECHA']||r['Fecha']||r.FECHA||r['FECHA_CORTE']||r['FECHA CORTE']||'');
					if(d) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
					return (r._year||r.AÑO||r['AÑO']||'') + '-' + String(r._month||r.MES||'').padStart(2,'0');
				})();
				if(!key) return;
				ingByPeriod[key] = (ingByPeriod[key]||0) + toNum(r[qtyCol]);
			});
			const keys = Array.from(new Set(Object.keys(defByPeriod).concat(Object.keys(ingByPeriod))));
			keys.sort((a,b)=>{ if(a.startsWith('SEM') && b.startsWith('SEM')) return parseInt(a.replace(/[^0-9]/g,''),10) - parseInt(b.replace(/[^0-9]/g,''),10); return a.localeCompare(b); });
			const labels = keys;
			const ingresoVals = keys.map(k=> ingByPeriod[k]||0);
			const defectVals = keys.map(k=> defByPeriod[k]||0);
			const pctVals = keys.map((k,i)=> { const ing = ingresoVals[i]||0; return ing>0 ? (defectVals[i]/ing)*100 : 0; });
			updatePctChart(labels, ingresoVals, pctVals);
		}

		function updatePctChart(labels, ingresoVals, pctVals){
			const card = document.getElementById('segPctChart') && document.getElementById('segPctChart').closest('.chart-card');

			if(!segPctChartInstance){
				const ctx = document.getElementById('segPctChart').getContext('2d');
				segPctChartInstance = new Chart(ctx, {
					data: { labels: labels, datasets: [ { type:'bar', label: 'TOTAL INGRESO A EMBALAJE', data: ingresoVals, backgroundColor: '#7fb3ff', yAxisID: 'y1' }, { type:'line', label: '% DEFECTOS vs INGRESO', data: pctVals, borderColor: '#d9534f', backgroundColor: 'rgba(217,83,79,0.08)', fill:false, yAxisID: 'y' } ] },
					options: { maintainAspectRatio:false, scales: { y: { type:'linear', position:'left', ticks:{ callback: v => v + '%' }, beginAtZero:true }, y1: { type:'linear', position:'right', grid:{ display:false }, beginAtZero:true }, x:{ ticks:{ maxRotation:0 } } }, plugins:{ legend:{ position:'bottom' }, datalabels:{ display:false } }
					}
				});
			} else {
				segPctChartInstance.data.labels = labels;
				segPctChartInstance.data.datasets[0].data = ingresoVals;
				segPctChartInstance.data.datasets[1].data = pctVals;
				segPctChartInstance.update();
			}
		}
	</script>
